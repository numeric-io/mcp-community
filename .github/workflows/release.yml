name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build toolkit .zip and per-skill .zip bundles
        run: |
          cd $GITHUB_WORKSPACE

          # Build the toolkit as a Claude plugin bundle — NOT a repo dump.
          # Structure: numeric-mcp-toolkit/.claude-plugin/plugin.json + skills/
          # (+ tools/sync_skills.py for the Codex/Gemini manual path, README, LICENSE).
          # Website files (index.html, assets/), docs/, and CI config stay out.
          STAGE="$RUNNER_TEMP/toolkit-stage"
          rm -rf "$STAGE" && mkdir -p "$STAGE/numeric-mcp-toolkit"
          cp -R .claude-plugin skills tools README.md LICENSE "$STAGE/numeric-mcp-toolkit/"
          find "$STAGE" -name ".DS_Store" -delete
          find "$STAGE" -name "__pycache__" -type d -prune -exec rm -rf {} + 2>/dev/null || true
          ( cd "$STAGE" && zip -rq "$GITHUB_WORKSPACE/numeric-mcp-toolkit.zip" numeric-mcp-toolkit )
          echo "Built: $(du -sh numeric-mcp-toolkit.zip)"
          unzip -l numeric-mcp-toolkit.zip | head -12

          # Build one .zip per skill directory.
          # IMPORTANT: cd into skills/ and zip by the bare folder name so the
          # archive's top-level entry is "<skill>/SKILL.md" (single folder),
          # NOT "skills/<skill>/SKILL.md". The extra nesting hides SKILL.md
          # from Claude on install.
          rm -rf dist && mkdir -p dist
          for skill_dir in skills/*/; do
            skill=$(basename "$skill_dir")
            ( cd skills && zip -rq "../dist/${skill}.zip" "$skill" -x "*.DS_Store" )
            echo "Built: $(du -sh "dist/${skill}.zip")"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            numeric-mcp-toolkit.zip
            dist/*.zip
          generate_release_notes: true
          body: |
            ## Install

            **Full toolkit (recommended)**
            Download `numeric-mcp-toolkit.zip` below and open it in Cowork or Claude Code.

            **Via Claude Code CLI**
            ```
            claude plugin install https://github.com/${{ github.repository }}
            ```

            **Individual skills**
            Download any `.zip` file below and open it in Cowork or Claude Code.
