<head>

<title>Resources — Numeric Community Skills Library</title>
<style>
  :root{
    color-scheme: light;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --bg:#F7F4EE; --surface:#FFFFFF; --ink:#14130F; --ink-2:#4B4944; --ink-3:#8A857A;
    --line:#E6E1D6; --line-2:#D8D2C3;
    --accent:#6B5BD3; --accent-deep:#4F3FB8; --accent-soft:#E4DEF7;
    --shadow:0 1px 2px rgba(20,19,15,0.04), 0 8px 24px rgba(20,19,15,0.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Inter","Helvetica Neue",Arial,sans-serif;
    font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;}

  .wrap{max-width:1280px;margin:0 auto;padding:32px 32px 80px}

  /* HERO — matches index hero treatment */
  header.top{padding:8px 0 24px;border-bottom:1px solid var(--line);margin-bottom:24px}
  h1{font-family:var(--serif);font-size:52px;font-weight:600;letter-spacing:-0.02em;line-height:1.0;color:var(--ink);margin:0 0 18px}
  h1 em{font-style:italic;font-weight:600;color:var(--accent)}
  .sub{color:var(--ink-2);font-size:15px;max-width:820px;line-height:1.5;margin:0}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
  .chip{font:inherit;font-size:13px;font-weight:500;color:var(--ink-2);background:var(--surface);border:1px solid var(--line-2);border-radius:999px;padding:6px 14px;cursor:pointer;transition:all .12s}
  .chip:hover{color:var(--ink);border-color:var(--ink-3)}
  .chip.active{color:#fff;background:var(--ink);border-color:var(--ink)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
  .card{background:#FAF8F5;border:1px solid #E9E5D9;border-radius:6px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s,background .15s}
  .card:hover{border-color:#CFC8B5;background:#fff}
  .thumb{position:relative;display:block;aspect-ratio:16/9;overflow:hidden;background:var(--line);cursor:pointer;border-bottom:1px solid #E9E5D9}
  .thumb img{display:block;width:100%;height:100%;object-fit:cover}
  .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:rgba(20,19,15,0.78);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;padding-left:4px;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,0.3);transition:transform .15s ease}
  .thumb:hover .play{transform:translate(-50%,-50%) scale(1.08)}
  .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
  .meta{font-size:11px;font-weight:500;letter-spacing:0.16em;text-transform:uppercase;color:#7036FF}
  .card h2{font-size:17px;font-weight:500;color:#080707;letter-spacing:-.005em;line-height:1.3;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card p{font-size:13px;color:rgba(8,7,7,.62);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tags{display:flex;flex-wrap:wrap;gap:4px 0;margin-top:auto;padding-top:12px;border-top:1px solid #E9E5D9}
  .tag{font-family:"DM Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);text-decoration:none}
  .tag + .tag::before{content:"◆";color:#7036FF;margin:0 6px;font-size:8px;vertical-align:1px}
  .tag:hover{color:#7036FF}
  .tag:hover{text-decoration:underline}
  .links{display:flex;gap:14px;font-size:13px}
  .links a{color:var(--accent-deep);text-decoration:none;font-weight:500}
  .links a:hover{text-decoration:underline}
  .empty{color:var(--ink-3);padding:24px 0}

  /* Lightbox — same treatment as the index gallery */
  .lightbox{position:fixed;inset:0;background:rgba(20,19,15,0.85);display:none;align-items:center;justify-content:center;padding:40px;z-index:200;cursor:zoom-out}
  .lightbox.open{display:flex}
  .lightbox iframe{width:min(1100px,calc(100% - 120px));aspect-ratio:16/9;max-height:100%;border:0;border-radius:8px;box-shadow:0 24px 64px rgba(0,0,0,0.4);background:#000}
  .lightbox video{width:min(1100px,calc(100% - 120px));max-height:100%;border-radius:8px;box-shadow:0 24px 64px rgba(0,0,0,0.4);background:#000}
  .lightbox-close{position:absolute;top:20px;right:24px;background:none;border:none;color:rgba(255,255,255,0.8);font-size:28px;cursor:pointer;line-height:1;padding:4px 10px}
  .lightbox-close:hover{color:#fff}

  footer{margin-top:28px;padding-top:20px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3);line-height:1.65}
  footer a{color:var(--accent-deep);text-decoration:none}
  footer a:hover{text-decoration:underline}
  @media(max-width:880px){.wrap{padding:24px 16px 60px}h1{font-size:32px}.grid{grid-template-columns:1fr}.lightbox{padding:16px}.lightbox iframe,.lightbox video{width:100%}}
  .site-nav{line-height:1.45;-webkit-font-smoothing:antialiased;position:sticky;top:0;z-index:50;background:rgba(247,244,238,.88);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
  .site-nav-inner{max-width:1280px;margin:0 auto;padding:0 32px;height:56px;display:flex;align-items:center;gap:28px}
  .site-nav-brand{display:flex;align-items:center;color:var(--ink);text-decoration:none}
  .site-nav-brand svg{height:18px;width:auto;display:block}
  .site-nav-links{display:flex;align-items:center;gap:4px;margin-left:auto}
  .site-nav-links a{font-size:13px;font-weight:500;color:var(--ink-2);text-decoration:none;padding:7px 13px;border-radius:7px;transition:all .12s;white-space:nowrap}
  .site-nav-links a:hover{color:var(--ink);background:rgba(20,19,15,.05)}
  .site-nav-links a.active{color:var(--accent-deep);background:var(--accent-soft)}
  @media(max-width:700px){.site-nav-inner{gap:10px;padding:0 16px}.site-nav-links a{padding:7px 9px;font-size:12px} .site-nav-links{min-width:0;overflow-x:auto;scrollbar-width:none}}
</style>

    <h1>MCP <em>Resources</em></h1>
    <div class="sub">Webinar recordings, training sessions, and demos for getting more out of Claude and the Numeric MCP.</div>
  </header>

  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>

    Want a training session for your team? Email <a href="mailto:support@numeric.io">support@numeric.io</a>.
  </footer>

<script>
// Add new recordings here. type: "Webinar" | "Training" | "Demo", or a list like ["Training", "Demo"]. date: YYYY-MM-DD (sorts newest first).
// skills: names from the Skills page; each becomes a link to that skill. slides is optional.
const RESOURCES = [
  {
    type: ["Training", "Demo"],
    title: "How to build a skill",
    date: "2026-10-26",
    length: "3 min",
    description: "Reconcile two balance-sheet accounts against their workbooks with Claude, then turn that workflow into a reusable skill.",
    video: "assets/building-a-skill.mp4",
    thumb: "assets/building-a-skill.jpg",
  },
  {
    type: "Webinar",
    title: "The State of AI in Accounting — and the Art of the Possible",
    date: "2026-10-04",
    length: "56 min",
    description: "Where AI in accounting stands today, and ideas for what your team could change next.",
    video: "https://www.youtube.com/embed/J5lguvJLPQM",
    thumb: "https://i.ytimg.com/vi/J5lguvJLPQM/hqdefault.jpg",
  },
  {
    type: "Webinar",
    title: "Community Builds Webinar - August 2026",
    date: "2026-08-27",
    length: "56 min",
    description: "Six finance operators give quick live demos of real AI builds for the close, plus live Q&A.",
    video: "https://www.youtube.com/embed/zthPcqYsP2A",
    thumb: "https://i.ytimg.com/vi/zthPcqYsP2A/hqdefault.jpg",
  },
  {
    type: "Webinar",
    title: "MCP 101: the new AI building block",
    date: "2026-07-31",
    length: "60 min",
    description: "What MCP is, why it matters for accounting teams, and how to start using it.",
    video: "https://www.youtube.com/embed/ovD0fOXdJPA",
    thumb: "https://i.ytimg.com/vi/ovD0fOXdJPA/hqdefault.jpg",
  },
  {
    type: "Webinar",
    title: "MCP 101 Webinar - Highlights",
    date: "2026-07-31",
    length: "7 min",
    description: "The key moments from the MCP 101 webinar in seven minutes.",
    video: "https://www.youtube.com/embed/ObH5Iaf80U4",
    thumb: "https://i.ytimg.com/vi/ObH5Iaf80U4/hqdefault.jpg",
  },
  {
    type: "Demo",
    title: "Numeric MCP Announcement + Walkthrough",
    date: "2026-05-06",
    length: "2 min",
    description: "Numeric co-founder and CPO Anthony Alvernaz walks through the Numeric MCP.",
    video: "https://www.youtube.com/embed/dkJanv11bV4",
    thumb: "https://i.ytimg.com/vi/dkJanv11bV4/hqdefault.jpg",
  },
  {
    type: "Demo",
    title: "End to End Accruals Processing using the Numeric MCP",
    date: "2026-06-04",
    description: "A walkthrough of processing accruals end to end with Claude and the Numeric MCP.",
    video: "https://www.loom.com/embed/cff9383995204a2690745ec05ddbf5bf",
    thumb: "https://cdn.loom.com/sessions/thumbnails/cff9383995204a2690745ec05ddbf5bf-4721fb30789479ab.gif",
    skills: ["complete-accruals-task"],
  },
  {
    type: "Demo",
    title: "Creating Journal Entries via the Numeric MCP",
    date: "2026-06-04",
    description: "A walkthrough of creating journal entries with Claude and the Numeric MCP.",
    video: "https://www.loom.com/embed/fde92f5fa7e34c1eae249a78b181bfd3",
    thumb: "https://cdn.loom.com/sessions/thumbnails/fde92f5fa7e34c1eae249a78b181bfd3-8a39b1319ed43e7d.gif",
    skills: ["journal-entry"],
  },
];

const TYPES = ["All", "Webinar", "Training", "Demo"];
let filter = "All";

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = d => new Date(d + "T00:00:00").toLocaleDateString("en-US", { month: "short", year: "numeric" });

function render() {
  document.getElementById("chips").innerHTML = TYPES.map(t =>
    `<button class="chip${t === filter ? " active" : ""}" onclick="setFilter('${t}')">${t}</button>`).join("");
  const items = RESOURCES.filter(r => filter === "All" || [].concat(r.type).includes(filter))
    .sort((a, b) => b.date.localeCompare(a.date));
  document.getElementById("grid").innerHTML = items.length ? items.map(r => `
    <article class="card">
      <a class="thumb" href="${esc(r.video)}" onclick="openVideo(this.href, this.title);return false" title="${esc(r.title)}">
        <img src="${esc(r.thumb)}" alt="${esc(r.title)}" loading="lazy" />
        <span class="play" aria-hidden="true">▶</span>
      </a>
      <div class="body">
        <div class="meta">${esc([].concat(r.type).join(" / "))} · ${fmtDate(r.date)}${r.length ? " · " + esc(r.length) : ""}</div>
        <h2>${esc(r.title)}</h2>
        ${r.description ? `<p>${esc(r.description)}</p>` : ""}
        ${r.slides ? `<div class="links"><a href="${esc(r.slides)}" target="_blank" rel="noopener">Slides →</a></div>` : ""}
        ${r.skills && r.skills.length ? `<div class="tags">${r.skills.map(s =>
          `<a class="tag" href="index.html#${encodeURIComponent(s)}">${esc(s)}</a>`).join("")}</div>` : ""}
      </div>
    </article>`).join("") : `<div class="empty">Nothing here yet.</div>`;
}
function setFilter(t) { filter = t; render(); }

function openVideo(src, title) {
  // Self-hosted .mp4 files play in <video>; Loom/YouTube embeds play in the iframe.
  const file = /\.mp4$/i.test(src);
  const frame = document.getElementById("lightbox-frame");
  const video = document.getElementById("lightbox-video");
  frame.style.display = file ? "none" : "";
  video.style.display = file ? "" : "none";
  if (file) { video.src = src; video.play(); } else frame.src = src;
  document.getElementById("lightbox").classList.add("open");
  window.posthog && posthog.capture("resource_video_open", { title });
}
function closeLightbox() {
  document.getElementById("lightbox").classList.remove("open");
  document.getElementById("lightbox-frame").src = "";   // unload video so audio stops
  const video = document.getElementById("lightbox-video");
  video.pause(); video.removeAttribute("src"); video.load();
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closeLightbox(); });

render();
</script>
