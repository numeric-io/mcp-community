* { box-sizing: border-box; }
html, body { margin: 0; }

.site-nav-links a { font-size: 13px; font-weight: 500; color: var(--text-secondary); text-decoration: none; padding: 7px 13px; border-radius: 7px; transition: all .12s; white-space: nowrap; }

.site-nav-links a.active { color: var(--color-accent-900); background: var(--bg-accent); }

::selection { background: var(--color-accent-100); }
.tile:hover { border-color: var(--text-primary) !important; box-shadow: var(--shadow-md); }
.btnx:hover { border-color: var(--text-primary); color: var(--text-primary); }
.chipbtn:hover { border-color: var(--text-primary); color: var(--text-primary); }
.cardx { background: var(--bg-default); border: 1px solid var(--border-default); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; transition: all .2s ease; cursor: pointer; }
.cardx:hover { border-color: var(--text-primary); transform: translateY(-2px); box-shadow: var(--shadow-md); }
.copybtn { padding: 7px 8px; border: 1px solid var(--border-subtle); background: var(--bg-default); border-radius: 6px; font-size: 11.5px; color: var(--text-secondary); cursor: pointer; font-family: inherit; font-weight: 500; transition: all .12s; flex: 1; }
.copybtn:hover { border-color: var(--text-primary); color: var(--text-primary); }
.copybtn.primary { background: var(--text-primary); color: #fff; border-color: var(--text-primary); }
.copybtn.primary:hover { background: var(--color-accent-700); border-color: var(--color-accent-700); }

s — uploads new files and creates folders, but doesn’t edit files in place.","salesforce":"Pulls CRM pipeline, bookings, and closed-won deals (official hosted MCP; Enterprise Edition and up).","snowflake":"Queries the source data warehouse for context the GL never sees — read-only by default, with large results truncated.","abacum":"Delivers FP&A narrative — variance commentary, anomaly flags, and scenario context.","chargebee":"Supplies subscription billing and deferred revenue schedules from Chargebee.","cube":"Runs live budget and forecast scenarios, with AI write-back gated to approved scenarios.","databricks":"Queries lakehouse data — usage, settlement, or warehouse detail the GL never sees.","datarails":"Consolidates ERP, CRM, HRIS, and billing data into one governed FinanceOS layer for AI.","expensify":"Supplies employee expense reports, receipts, and reimbursement data from Expensify.","gsheets":"Reads live schedules and writes tie-out workpapers — spreadsheet-native alternative to Excel.","gusto":"Feeds headcount, payroll runs, and compensation data from Gusto.","hibob":"Feeds headcount, payroll runs, and compensation data from HiBob.","hubspot":"Pulls CRM pipeline, deals, and closed-won bookings from HubSpot.","pigment":"Supplies budget and forecast metrics for variance checks — read-only, numeric fields only.","vena":"Runs governed budget, forecast, and scenario reads and writes with a full approval trail.","zip":"Supplies open purchase orders, active contracts, and vendor request data from Zip's procurement orchestration layer.","zuora":"Supplies subscription billing, orders, and deferred revenue data from Zuora."},"COMBOS":[{"mcps":["netsuite","numeric","pigment"],"workflow":"Accrual Candidates vs. Budget","status":"live","payoff":"Stage accrual candidates from open POs and prior-period patterns, checked against remaining budget before the task is even opened.","prompt":"Propose accrual candidates this month and flag anything over budget.","summary":"Cl ers reconciliation support from a Databricks export, organizes it into a structured binder by account with an index, and flags any rec that's missing evidence. The binder is linked to the close in Numeric, so reviewers and auditors can pull support in seconds. Completeness gaps become visible before the auditors find them, and evidence stops living in seventeen inconsistently named folders."},{"mcps":["gdrive","netsuite","numeric"],"workflow":"Audit PBC Package","status":"live","payoff":"Compile GL detail and support into the auditor request package.","prompt":"Compile the auditor PBC package from the GL and support.","summary":"Claude compiles the auditor request package by mapping each item on the PBC list to its GL detail in NetSuite and its supporting files in Google Drive, packaging everything by request number. A gap list shows anything that can't be produced yet, with owners assigned in Numeric so gaps get worked rather than rediscovered. The package goes out complete on the first pass instead of dribbling out over three follow-up rounds."},{"mcps":["gmail","slack"],"workflow":"Approval Routing","status":"live","payoff":"Forward approval requests from email into the right Slack channel.","prompt":"Forward this approval request to the right Slack channel.","summary":"Claude watches Gmail for approval requests and forwards each into the right Slack channel by type — spend to spend approvals, contracts to legal, entries to accounting — with the key details summarized and a link back to the email thread. Approvals happen where the team already works, response times drop, and the trail is preserved end to end for anyone who needs to reconstruct a decision later."},{"mcps":["netsuite","excel","numeric"],"workflow":"Workpaper Automation","status":"live","payoff":"Pull the trial balance into a tie-out workpaper each period.","prompt":"Pull the trial balance into a tie-out workpaper and automate the build.","summary":"Claude pulls the trial balance from NetSuite into g SOPs with no linked files, files with no SOP, and documents that haven't been touched in over a year. Procedure and support stay findable together, and stale documentation surfaces on a schedule instead of misleading someone mid-close."},{"mcps":["numeric","netsuite","slack"],"workflow":"Flux Sign-Off in Slack","status":"live","payoff":"Draft flux explanations and collect sign-off in Slack.","prompt":"Draft the flux explanations and collect sign-off in Slack.","summary":"Claude drafts flux explanations from GL movement in NetSuite and Numeric's flux engine for every account over threshold, posts them to Slack for reviewer sign-off, and attaches the approved narratives back to the period in Numeric. Reviewers approve or push back in-channel, with edits captured. The period ends with every material variance explained, reviewed, and signed — without a single status meeting about it."},{"mcps":["numeric","netsuite","excel"],"workflow":"Cash Flow Forecast Report & Export","status":"live","payoff":"Export a rolling cash flow forecast that blends live GL cash balances with forward-looking assumptions, ready to share or drop into a board pack.","prompt":"Build this week's cash flow forecast and export it to Excel.","summary":"Claude blends live GL cash balances and activity from NetSuite with the forward-looking assumptions maintained in Numeric to build a rolling cash flow forecast, exported to Excel ready to share or drop into a board pack. Actuals refresh automatically each run, so the forecast always starts from where cash actually is. Treasury visibility stops depending on someone rebuilding the model every week."},{"mcps":["snowflake","netsuite"],"workflow":"GL-to-Warehouse Reconciliation","status":"live","payoff":"Reconcile the GL against the source data warehouse.","prompt":"Reconcile the GL against the data warehouse.","summary":"Claude reconciles GL balances in NetSuite against the source data in Snowflake — revenue to billing events, COGS to settlement detail — aggregating in SQL so raw rows never hit the conversation. Differences are isolated by driver: timing, mapping, and completeness gaps between the books and the warehouse get quantified and explained. “The dashboard doesn't match the financials” stops being a recurring board-meeting question."},{"mcps":["snowflake","excel","numeric"],"workflow":"Board KPI Pack","status":"live","payoff":"Build board KPIs from warehouse data with close context.","prompt":"Build the board KPI pack from the warehouse data.","summary":"Claude builds board-ready KPIs — ARR, NRR, burn, runway, headcount — from pre-aggregated Snowflake queries, layers in close context from Numeric, and assembles the pack in Excel with month-over-month trends. Metric definitions are applied consistently period to period, and any definition change is noted in the pack. The KPI pack refreshes each period instead of being rebuilt from scratch by whoever drew the short straw."},{"mcps":["carta","netsuite","excel","numeric"],"workflow":"Stock-Based Comp Schedule","status":"trialing","payoff":"Build the ASC 718 expense schedule from grant and vesting data.","prompt":"Build the ASC 718 stock-comp schedule from Carta.","summary":"Claude pulls grant and vesting data from Carta and builds the ASC 718 expense schedule in Excel — expense by grant, by period, with forfeiture assumptions applied and visible. The schedule ties to the stock-comp accounts in NetSuite, and the draft entry is prepared with the schedule as support, documented in Numeric. The 718 calculation becomes a maintained schedule instead of an annual archaeology project."},{"mcps":["carta","netsuite","numeric"],"workflow":"Equity Expense Accrual","status":"trialing","payoff":"Accrue stock-comp expense and reconcile the equity rollforward.","prompt":"Accrue stock-comp expense and reconcile the equity rollforward.","summary":"Claude accrues the period's stock-comp expense from Carta vesting data, drafts the entry, and reconciles the equity rollforward — APIC, expense, and forfeitures — to NetSuite, with the workpaper logged in Numeric. Equity expense and the equity accounts stay in agreement every period, not just at audit time, and the rollforward is always current when someone asks for it."},{"mcps":["carta","excel"],"workflow":"Cap Table Tie-Out","status":"trialing","payoff":"Reconcile shares outstanding and the option pool to your records.","prompt":"Reconcile shares outstanding and the option pool to our records.","summary":"Claude reconciles shares outstanding, the option pool, and recent grant activity in Carta against your internal records, laying the tie-out into Excel with differences itemized. Discrepancies — missed grants, unrecorded cancellations, stale pool math — surface each period rather than during a financing scramble. The cap table you report from and the cap table of record stop drifting apart."},{"mcps":["carta","numeric"],"workflow":"Equity Close Tasks","status":"trialing","payoff":"Track 409A and equity close tasks against documented status.","prompt":"Track our 409A and equity close tasks.","summary":"Claude tracks the equity workstream in Numeric — 409A status, new grants awaiting board approval, vesting events in the period — against Carta's current data, updating each task with status and flagging anything that blocks the close. Equity stops being the close's blind spot managed from someone's calendar reminders, and the controller can see the whole workstream alongside the rest of the close."},{"mcps":["numeric","netsuite"],"workflow":"Bank Rec & Flux","status":"conceptual","payoff":"Reconcile bank activity and auto-draft variance explanations each period.","summary":"Claude pulls daily bank activity and the GL cash accounts from NetSuite, auto-matches cleared items, and surfaces unreconciled transactions for review with date, amount, and counterparty. Numeric then drafts the period-over-period cash flux narrative, so the explanation is written before anyone opens the workpaper. The bank rec becomes an exception review, and the cash story is ready when the reviewer is."},{"mcps":["excel","numeric"],"workflow":"Schedule-Backed Close Tasks","status":"conceptual","payoff":"Drive close tasks and tie-outs from live Excel schedules.","summary":"Claude drives close tasks directly from their supporting Excel schedules — refreshing each schedule, running the tie-out to the GL, and updating task status in Numeric as each one completes. Anything that doesn't tie within threshold is flagged with the difference quantified. The checklist and the supporting math stay in sync instead of drifting apart mid-close."},{"mcps":["rippling","numeric","slack"],"workflow":"Headcount Flux Explanations","status":"conceptual","payoff":"Explain comp variances using live headcount, delivered straight to Slack.","summary":"Claude pulls live headcount and compensation data from Rippling — hires, terminations, transfers, and rate changes — and maps each movement to its dollar impact on the period's comp expense. It then drafts the variance explanation directly in Numeric's flux engine, splitting the total change into its drivers so reviewers see exactly why comp moved. A summary posts to Slack so reviewers get the story without opening the payroll system. The “why” behind comp variances is written before anyone has to dig through payroll reports."},{"mcps":["rippling","netsuite","numeric"],"workflow":"Payroll Tax Accrual","status":"conceptual","payoff":"Accrue employer taxes per run and reconcile the liabilities.","summary":"Claude accrues employer payroll taxes — FICA, FUTA, SUTA — from each run using Rippling compensation data, builds the supporting schedule, and reconciles the liability accounts in NetSuite. The draft accrual entry is prepared with the schedule attached and logged in Numeric for review. Payroll tax liabilities tie out every period instead of accumulating small unexplained differences all year."},{"mcps":["rippling","numeric"],"workflow":"Headcount Roll-Forward","status":"conceptual","payoff":"Reconcile beginning-to-ending headcount for FP&A.","summary":"Claude builds the period's headcount roll-forward from Rippling — beginning count, hires, terminations, transfers, ending count, by department — and reconciles it to last period's ending figure, documenting the walk in Numeric. FP&A gets a clean, explained view of the period's people change without pulling reports from the HRIS or reconciling three competing headcount numbers."},{"mcps":["rippling","netsuite","excel","numeric"],"workflow":"Bonus Accrual","status":"conceptual","payoff":"Accrue bonus pools from comp data, schedule, and reconcile to GL.","summary":"Claude pulls eligible compensation and plan data from Rippling, applies the bonus plan's accrual logic — percentage, proration, service period — and maintains the accrual schedule in Excel. It reconciles the accrued balance to the GL in NetSuite, drafts the true-up entry with the change explained, and logs the workpaper in Numeric. The full pool is supported and ties out every period, instead of being trued up once a year from a spreadsheet nobody fully trusts."},{"mcps":["rippling","gdrive","numeric"],"workflow":"Payroll Document Archive","status":"conceptual","payoff":"Archive payroll registers to shared storage and link them as close evidence.","summary":"Each period, Claude takes the payroll registers and tax filings exported from Rippling and archives them to a structured Google Drive folder, organized by period and entity, verifying nothing is missing from recent months. It then links each document as supporting evidence on the payroll reconciliation and close tasks in Numeric, so the archive stays connected to the work it supports. When an auditor asks for a register, it's one link away instead of a payroll-system fire drill."},{"mcps":["rippling","slack"],"workflow":"Headcount Change Alerts","status":"conceptual","payoff":"Notify finance when headcount moves hit the budget.","summary":"Claude watches Rippling for headcount movements — hires, terminations, and comp changes — and posts an alert to the finance Slack channel when one lands, with the annualized dollar impact and the running variance against the headcount plan. Material people-cost changes reach finance when they happen, not when the payroll variance surfaces at close. Budget conversations happen with the hiring manager in the moment, while the decision is still fresh."},{"mcps":["gmail","billcom","numeric"],"workflow":"Vendor Invoice Intake","status":"conceptual","payoff":"Route emailed invoices into the AP queue, then tie open payables to the GL.","summary":"Claude routes vendor invoices arriving in Gmail into the Bill.com AP queue with vendor, amount, and due date pre-filled and duplicates flagged. Numeric then reconciles open Bill.com payables to the GL AP balance and tests period cutoff, listing any invoice with a service date in the closed period so it can be accrued. Intake feeds a tied-out payables reconciliation rather than a standalone queue."},{"mcps":["billcom","numeric"],"workflow":"AP Cutoff Testing","status":"conceptual","payoff":"Test for unrecorded liabilities at period end.","summary":"Claude tests Bill.com payables for unrecorded liabilities at period end — pulling invoices entered early in the new month, identifying service or receipt dates that fall in the closed period, and quantifying the exposure. If it's material, the accrual is drafted with support, and the cutoff conclusion is documented in Numeric. Cutoff goes from an auditor-only test to a control you run yourself, every period."},{"mcps":["ramp","notion","numeric"],"workflow":"Expense Policy Enforcement","status":"conceptual","payoff":"Check card spend against policy, then surface exceptions as close review items.","summary":"Claude checks Ramp card spend against the expense policy documented in Notion, flagging each violation with the transaction, employee, and the specific policy clause it breaks. Exceptions surface in Numeric as review notes on the affected spend accounts and are tracked to resolution inside the close. Policy breaks get cleared as part of the period instead of accumulating in a side report nobody owns."},{"mcps":["salesforce","billcom","numeric"],"workflow":"Order-to-Invoice Check","status":"conceptual","payoff":"Confirm every closed-won deal was invoiced, then tie billings to recognized revenue.","summary":"Claude confirms every closed-won Salesforce deal has a matching Bill.com invoice with the right amount and terms — flagging missing invoices, amount mismatches, and billing starts that don't match the contract. Numeric then bridges billed amounts to recognized revenue so any gap shows up as potential leakage during the close, with the reconciliation documented for review. Deals stop falling through the crack between sales and billing."},{"mcps":["stripe","billcom","numeric"],"workflow":"Cash Application Review","status":"conceptual","payoff":"Match incoming payments to open invoices and flag exceptions.","summary":"Claude matches incoming Stripe and Bill.com payments to open invoices, applies the exact matches, and produces the exception list — partial payments, overpayments, and receipts with no matching invoice — each with a suggested treatment. Numeric clears applied cash and keeps the unapplied balance visible until it's resolved. Cash application stops consuming the first two days of AR's month."},{"mcps":["snowflake","salesforce","numeric"],"workflow":"Usage-Based Revenue","status":"conceptual","payoff":"Recognize consumption revenue from product usage data.","summary":"Claude aggregates consumption data in Snowflake by customer — never pulling raw event rows — applies each Salesforce contract's rate terms, and calculates the period's usage-based revenue. The recognition entry is drafted with the usage summary as support and documented in Numeric. Metered revenue gets booked from actual consumption under actual contract terms, with the calculation reviewable end to end."},{"mcps":["gmail","numeric","netsuite"],"workflow":"Bank Confirmation Match","status":"conceptual","payoff":"Match emailed bank confirmations to GL balances.","summary":"Claude matches bank confirmations arriving in Gmail to the corresponding GL cash balances in NetSuite as of the confirmation date, listing any that don't agree with the difference quantified and the likely cause identified. The results are documented in Numeric with the confirmations attached. Confirmation season becomes a same-day exception review instead of a paper chase."},{"mcps":["netsuite","numeric","gdrive"],"workflow":"Month-End Tie-Out Binder","status":"conceptual","payoff":"Compile every tie-out and GL support into one binder.","summary":"Claude compiles every GL tie-out from NetSuite with its supporting files from Google Drive into a single month-end binder, organized by account, with a checklist showing what's tied, what's outstanding, and who owns each open item. Numeric tracks the binder's completeness through close. Review is fast, audit pull is faster, and nothing ships untied without someone deciding it can."},{"mcps":["gdrive","numeric"],"workflow":"Evidence Binder Assembly","status":"conceptual","payoff":"Auto-assemble support files into a reconciliation binder.","summary":"Claude gathers reconciliation support from Google Drive, organizes it into a structured binder by account with an index, and flags any rec that's missing evidence. The binder is linked to the close in Numeric, so reviewers and auditors can pull support in seconds. Completeness gaps become visible before the auditors find them, and evidence stops living in seventeen inconsistently named folders."}],"CATEGORIES":["FP&A","AP","Payroll & HR","Expenses","Revenue & Billing","Sales","Close Operations","Core Financials"],"WORKFLOW_CATEGORIES":{"Accrual Candidates vs. Budget":"FP&A","BVA Flux with Narrative Draft":"FP&A","Accrual-to-Budget Reconciliation":"FP&A","Materiality-Weighted FP&A Monitor":"FP&A","Board Package Assembly":"FP&A","Anomaly-to-Task Pipeline":"FP&A","Inbox-to-AP Capture":"AP","AP Reconciliation":"AP","AP Aging Workpaper":"AP","Accrual Identification":"AP","Headcount Flux Explanations":"Payroll & HR","Payroll Register Reconciliation":"Payroll & HR","Payroll JE Automation":"Payroll & HR","Comp Expense Allocation":"Payroll & HR","Bonus Accrual":"Payroll & HR","Payroll Document Archive":"Payroll & HR","Headcount Change Alerts":"Payroll & HR","CC Balance Reconciliation":"Expenses","CC Categorization Reconciliation":"Expenses","Reimbursement Reconciliation":"Expenses","Real-Time Spend Accrual":"Expenses","Deferred Revenue Rollforward":"Revenue & Billing","Deferred Revenue Rollforward & Reconciliation":"Revenue & Billing","Failed Payment Watch":"Revenue & Billing","AR Aging & Allowance":"Revenue & Billing","ARR Bridge":"Revenue & Billing","Deferred Schedule Build":"Revenue & Billing","Bookings-to-Revenue Bridge":"Sales","Quote-to-Cash Pipeline":"Sales","Pipeline-to-Forecast Check":"Sales","Commission Accrual":"Sales","Bookings Digest":"Sales","Automated Accrual Schedules":"Close Operations","Automated Accrual Schedules (Google Sheets)":"Close Operations","Posting Alerts & Approvals":"Close Operations","Process-Aware Close Assistant":"Close Operations","Close Status Digests":"Close Operations","Doc-Aware Rec Prep":"Close Operations","Flux on Warehouse Financial Data":"Close Operations","PBC & Confirmation Tracker":"Close Operations","Synced Shared Workpapers":"Close Operations","Process Docs in Channel":"Close Operations","Close Checklist Runbook":"Close Operations","Evidence Binder Assembly":"Close Operations","Audit PBC Package":"Close Operations","Approval Routing":"Close Operations","Workpaper Automation":"Close Operations","Variance Review Pack":"Close Operations","Rec Sign-Off Trail":"Close Operations","Process Doc Library":"Close Operations","Flux Sign-Off in Slack":"Close Operations","Cash Flow Forecast Report & Export":"Core Financials","GL-to-Warehouse Reconciliation":"Core Financials","Board KPI Pack":"Core Financials","Stock-Based Comp Schedule":"Core Financials","Equity Expense Accrual":"Core Financials","Cap Table Tie-Out":"Core Financials","Equity Close Tasks":"Core Financials","Bank Rec & Flux":"Close Operations","Schedule-Backed Close Tasks":"Close Operations","Payroll Tax Accrual":"Payroll & HR","Headcount Roll-Forward":"Payroll & HR","Vendor Invoice Intake":"AP","AP Cutoff Testing":"AP","Expense Policy Enforcement":"Expenses","Order-to-Invoice Check":"Revenue & Billing","Cash Application Review":"Revenue & Billing","Usage-Based Revenue":"Revenue & Billing","Bank Confirmation Match":"Close Operations","Month-End Tie-Out Binder":"Close Operations"},"PROMPTS":{"Bank Rec & Flux":"Pull this month's bank activity and the GL cash accounts from NetSuite, auto-match cleared items, and list every unmatched transaction over $1,000 with date, amount, and counterparty. Then draft the month-over-month cash flux explanation in Numeric for my review.","Automated Accrual Schedules":"Refresh each recurring accrual schedule in the workbook from its underlying terms, recalculate this month's expense, and draft the journal entries with account, memo, and support attached. Show me every entry for approval before anything posts to NetSuite.","Process-Aware Close Assistant":"Open our close procedures in Notion and walk me through today's close tasks in order, following our documented steps exactly — and flag anywhere the current state of the books doesn't match what the SOP expects.","Close Status Digests":"Post today's close digest to #close: tasks completed since yesterday, what's due today by owner, anything overdue or blocked, and whether we're on pace versus last month's close.","Deferred Revenue Rollforward":"Roll the deferred revenue balance forward for this period: recognize revenue from Stripe billings under our policy, tie the ending balance to NetSuite, and show the full walk — beginning balance, billings, recognition, ending — with any plug flagged.","Bookings-to-Revenue Bridge":"Bridge this quarter's Salesforce closed-won bookings to recognized revenue in NetSuite under ASC 606: show bookings, billed, deferred, and recognized by month, and explain every gap over $50,000.","Custom Flux Analytics":"Run flux on revenue by product line: aggregate this month versus last in Snowflake (don't pull raw rows), explain every variance over 5% or $100K, and draft the narrative in Numeric with the query results as support.","PBC & Confirmation Tracker":"Search my inbox for auditor PBC requests and vendor confirmations from the last 30 days, build an open-items list with owner and due date, mark what's already been provided, and draft — don't send — chase emails for anything outstanding.","Inbox-to-AP Capture":"Find vendor invoices in my inbox from the last two weeks, extract vendor, amount, invoice number, and suggested GL coding, and draft the AP bills in NetSuite. Then in Numeric, flag any invoice whose service date falls in the closed period, draft the accrual, and log it on the AP close task — and list anything you couldn't fully read for me to handle manually.","Headcount Flux Explanations":"Explain this month's comp expense variance using Rippling headcount data — split it into hires, terminations, and rate changes with the dollar impact of each — and post the narrative to #close for review.","Process Docs in Channel":"When someone asks how a close task is done in #close, find the matching SOP in Notion and post the relevant steps in the thread with a link to the full doc.","Schedule-Backed Close Tasks":"Go through my close tasks that have a supporting Excel schedule: refresh each schedule, run the tie-out to the GL, update the task status in Numeric, and list anything that doesn't tie within $100.","Failed Payment Watch":"Check Stripe for failed charges and active dunning over the last 30 days, quantify the at-risk revenue by customer, and post a summary to #close with anything over $5,000 called out individually.","Pipeline-to-Forecast Check":"Compare the revenue forecast to current Salesforce pipeline: for each month of the quarter, show forecast versus weighted pipeline versus closed-won to date, and flag where the forecast assumes deals the pipeline doesn't support.","Payroll Tax Accrual":"Accrue employer payroll taxes for this period's runs — FICA, FUTA, SUTA — build the supporting schedule, reconcile the liability accounts in NetSuite, and draft the accrual entry for review.","Headcount Roll-Forward":"Build the headcount roll-forward for the month from Rippling: beginning count, hires, terminations, transfers, ending count — by department — and reconcile it to last month's ending figure.","Close Checklist Runbook":"Run today's portion of the documented close checklist from Notion: complete what you can, update each task's status in Numeric as you go, and post a summary to #close of what's done, what's blocked, and what needs a human.","Evidence Binder Assembly":"Assemble the reconciliation binder for the cash and prepaid accounts: gather the support files from Drive, organize them by account with an index, and flag any rec that's missing evidence.","Audit PBC Package":"Compile the auditor PBC package: map each item on the PBC list to its GL detail from NetSuite and its support in Drive, package everything by request number, and give me a gap list of anything we can't produce yet.","Vendor Invoice Intake":"Check my inbox for new vendor invoices, extract vendor, amount, and due date, and route them into the Bill.com AP queue, flagging duplicates. Then in Numeric, reconcile open Bill.com payables to the AP balance and test cutoff — list any invoice with a service date in the closed period so I can accrue it.","Approval Routing":"Watch my inbox for approval requests and route each to the right Slack channel by type — spend to #spend-approvals, contracts to #legal — with the key details and a link back to the email thread.","Board KPI Pack":"Build the board KPI pack from pre-aggregated Snowflake queries — ARR, NRR, burn, runway, headcount — assemble it in Excel with month-over-month trends, and note anywhere a metric definition changed this quarter.","ARR Bridge":"Build this month's ARR bridge from monthly aggregates: beginning ARR, new, expansion, contraction, churn, ending — reconciled to Stripe billings — drilling into individual accounts only where a movement needs explaining.","Order-to-Invoice Check":"For every Salesforce deal closed-won this month, confirm a matching Bill.com invoice exists with the right amount and terms — list deals with no invoice, amount mismatches over $1,000, or billing starts that don't match the contract. Then in Numeric, reconcile billed amounts to recognized revenue and flag any gap as potential leakage.","Cash Application Review":"Match this week's incoming payments to open invoices, apply the exact matches, and give me the exception list — partial payments, overpayments, and receipts with no matching invoice — with a suggested treatment for each.","Variance Review Pack":"Build the monthly variance pack: actual versus budget and versus prior month by department, with drafted explanations for every variance over threshold, routed to #close for sign-off with approvals tracked per section.","Expense Policy Enforcement":"Check this month's Ramp transactions against the expense policy in Notion — one period at a time — and list each violation with the transaction, employee, and the policy clause it breaks. Then in Numeric, log the exceptions as review notes on the related spend accounts so they're tracked to resolution before close.","Rec Sign-Off Trail":"Route the completed bank and AP reconciliations for review: attach the evidence from Drive, request sign-off in #close, and record who approved what and when back on each rec task.","Bonus Accrual":"Update the bonus accrual: pull eligible comp from Rippling, apply the plan's accrual percentage by quarter of service, reconcile the accrued balance to the GL, and draft the true-up entry with the change explained.","Payroll Document Archive":"Archive this period's payroll registers and tax filings to the payroll folder in Drive, organized by period and entity, and confirm nothing from the last six months is missing. Then in Numeric, attach each document as evidence on the payroll reconciliation and close task for the period.","Process Doc Library":"Build an index linking each close SOP in Notion to its working files in Drive — and flag SOPs with no linked files, files with no SOP, and docs that haven't been updated in over a year.","Usage-Based Revenue":"Calculate this month's usage-based revenue: aggregate consumption in Snowflake by customer (no raw event rows), apply each Salesforce contract's rate terms, and draft the recognition entry with the usage summary as support.","Flux Sign-Off in Slack":"Draft flux explanations for every account over threshold this month, post them to #close for reviewer sign-off, and attach the approved narratives back to the period in Numeric.","Bank Confirmation Match":"Match the bank confirmations in my inbox to the corresponding GL cash balances in NetSuite as of the confirmation date — and list any that don't agree, with the difference and likely cause.","Real-Time Spend Accrual":"Accrue committed Ramp spend that isn't on a statement yet — this period only, transactions over $500 — and draft the accrual entry with an automatic reversal set for next period.","AP Cutoff Testing":"Test AP cutoff: pull invoices entered in the first ten days of the new month, identify service or receipt dates in the closed period, quantify the unrecorded liability, and draft the accrual if it's material.","Month-End Tie-Out Binder":"Compile the month-end binder: every GL tie-out from NetSuite with its support from Drive, organized by account, with a checklist showing what's tied, what's outstanding, and who owns each open item.","Headcount Change Alerts":"Alert #finance when Rippling headcount changes hit the budget — each hire, termination, or comp change with its annualized dollar impact and the running variance to the headcount plan.","Bookings Digest":"Post this week's new Salesforce closed-won deals to #finance: customer, amount, term, billing schedule, and any non-standard terms that affect revenue recognition.","Equity Expense Accrual":"Accrue this period's stock-comp expense from Carta vesting data, draft the entry, and reconcile the equity rollforward — APIC, expense, and forfeitures — to NetSuite.","Equity Close Tasks":"Review our equity close tasks: 409A status, new grants awaiting board approval, and vesting events this period — update each task with current status and flag anything blocking the close."},"SUMMARIES":{"Bank Rec & Flux":"Pulls daily bank activity and the GL cash accounts, auto-matches cleared items, and surfaces unreconciled transactions for review. Numeric then drafts the period-over-period flux narrative for cash so the explanation is written before anyone opens the workpaper.","Automated Accrual Schedules":"Maintains recurring accrual workpapers in Excel — rent, software, services — and recalculates each period from the underlying schedule. Numeric drafts the corresponding journal entry and posts it back to the NetSuite GL once approved, closing the loop without manual re-keying.","Process-Aware Close Assistant":"Grounds the close copilot in your Notion SOPs so its suggestions follow your documented procedures rather than generic accounting defaults. It answers questions, drafts workpapers, and flags steps exactly the way your team has written them up.","Close Status Digests":"Compiles a daily digest of open close tasks, owners, and blockers and posts it to Slack each morning. When a task slips or a dependency is blocked, Numeric escalates automatically so nothing stalls silently.","Deferred Revenue Rollforward":"Recognizes revenue from Stripe billing activity under your recognition policy and rolls the deferred balance forward each period. Numeric ties the ending balance to the NetSuite GL and drafts the recognition entry.","Bookings-to-Revenue Bridge":"Connects signed bookings in Salesforce to recognized revenue in NetSuite and explains the gap under ASC 606. Numeric documents the bridge so the revenue number is defensible to auditors.","Custom Flux Analytics":"Runs flux analysis against Snowflake warehouse data — by product, region, or cohort — that the GL alone cannot see. Numeric writes the variance narrative and supports it with the underlying query results in Excel.","PBC & Confirmation Tracker":"Tracks auditor PBC requests and vendor confirmations arriving in Gmail against an open-items list. Numeric chases outstanding items and keeps the status visible through close so nothing is missed.","Inbox-to-AP Capture":"Reads vendor invoice emails in Gmail, extracts vendor, amount, and GL coding from the message and any readable attachment, and drafts the AP bill in NetSuite. Numeric then checks each invoice against period cutoff, drafts an accrual for anything received late, and logs the item on the AP close task — so nothing sits in an inbox unbooked. Image-only PDF attachments may still need a manual download step.","Headcount Flux Explanations":"Explains compensation variances using live Rippling headcount data — new hires, departures, and rate changes — and delivers the written explanation to Slack. Reviewers get the why behind the number without digging through payroll.","Process Docs in Channel":"Surfaces the right Notion SOP directly in the Slack close channel the moment someone asks how a task is done. The team gets the documented procedure in context instead of searching the wiki.","Schedule-Backed Close Tasks":"Drives close tasks and tie-outs directly from live Excel schedules, so the checklist and the supporting math stay in sync. Numeric reads the schedule, completes the tie-out, and updates task status.","Failed Payment Watch":"Monitors Stripe for failed charges and dunning exposure and flags at-risk revenue to the Slack close channel. Numeric quantifies the exposure so collectability and revenue impact are visible early.","Pipeline-to-Forecast Check":"Sanity-checks the revenue forecast against live Salesforce pipeline and flags where bookings assumptions diverge from CRM reality. Numeric highlights the deltas for FP&A before the forecast is locked.","Payroll Tax Accrual":"Accrues employer payroll taxes from each run — using Rippling comp data and the exported register — and reconciles the liability balances in NetSuite. Numeric builds the supporting schedule and drafts the accrual entry.","Headcount Roll-Forward":"Reconciles beginning-to-ending headcount from Rippling for FP&A, accounting for hires, terminations, and transfers. Numeric produces a clean roll-forward that explains the period change.","Close Checklist Runbook":"Runs your documented Notion close checklist end to end, completing tasks where it can and posting status to Slack. The runbook stays in lockstep with the procedure as written.","Evidence Binder Assembly":"Auto-assembles support files from Google Drive into a structured reconciliation binder organized by account. Numeric indexes the evidence so review and audit pull is fast.","Audit PBC Package":"Compiles GL detail from NetSuite and supporting files from Google Drive into the auditor request package. Numeric maps each item to the PBC list so the package is complete on the first pass.","Vendor Invoice Intake":"Routes vendor invoices arriving in Gmail straight into the Bill.com AP queue with vendor and amount pre-filled. Numeric then reconciles open Bill.com payables to the GL AP balance and tests period cutoff, so intake feeds a tied-out payables reconciliation rather than a standalone queue.","Approval Routing":"Forwards approval requests from Gmail into the correct Slack channel based on type and owner. Approvals happen where the team works and the trail is preserved.","Board KPI Pack":"Builds board-ready KPIs from Snowflake warehouse data, layered with close context, and assembles the schedule in Excel. Numeric refreshes the metrics each period so the pack is current.","ARR Bridge":"Reconciles new, expansion, contraction, and churned ARR from Salesforce and Stripe back to billings. Numeric explains each movement so the ARR walk ties to the financials.","Order-to-Invoice Check":"Confirms every closed-won Salesforce deal has a corresponding invoice in Bill.com and flags gaps — missing invoices, amount mismatches, wrong billing starts. Numeric then bridges billed amounts to recognized revenue so any gap shows up as revenue leakage in the close, with the reconciliation documented for review.","Cash Application Review":"Matches incoming Stripe and Bill.com payments to open invoices and flags exceptions for review. Numeric clears applied cash and isolates unmatched receipts.","Variance Review Pack":"Builds the monthly variance pack from GL data, drafts the explanations, and routes it through Slack for sign-off. Reviewers approve in-channel and the sign-offs attach to the pack.","Expense Policy Enforcement":"Checks Ramp card spend against the documented expense policy in Notion and flags violations, citing the specific clause each one breaks. Numeric surfaces the exceptions as transaction-monitor flags and review notes against the affected spend accounts, so policy breaks are cleared inside the close rather than in a side report.","Rec Sign-Off Trail":"Routes reconciliations for review with the supporting evidence from Google Drive attached and collects sign-off in Slack. Numeric preserves the full approval and evidence trail for audit.","Bonus Accrual":"Accrues bonus pools from Rippling compensation data, maintains the schedule in Excel, drafts the entry, and reconciles the accrual to the NetSuite GL. The full pool is supported and ties out each period.","Payroll Document Archive":"Archives payroll registers and tax filings exported from Rippling to a structured Google Drive folder each period, then links each document as supporting evidence on the payroll reconciliation and close tasks in Numeric — so the archive is both complete for audit and connected to the work it supports.","Process Doc Library":"Keeps Notion SOPs and their working files in Google Drive linked in one navigable library. Numeric maintains the cross-references so procedure and support stay together.","Usage-Based Revenue":"Recognizes consumption revenue from product usage data in Snowflake, mapped to Salesforce contracts. Numeric calculates recognition per the metering terms and supports the entry.","Flux Sign-Off in Slack":"Drafts the flux explanations from GL movement and collects reviewer sign-off directly in Slack. Numeric attaches the approved narratives back to the period.","Bank Confirmation Match":"Matches bank confirmations arriving in Gmail to the corresponding GL cash balances in NetSuite. Numeric flags any confirmation that does not agree to the books.","Real-Time Spend Accrual":"Accrues committed Ramp card spend before statements post so the period reflects true spend. Numeric reverses the accrual when the actual statement lands.","AP Cutoff Testing":"Tests Bill.com payables for unrecorded liabilities at period end and flags invoices booked in the wrong period. Numeric documents the cutoff conclusion with supporting detail.","Month-End Tie-Out Binder":"Compiles every NetSuite GL tie-out and its Google Drive support into a single month-end binder. Numeric organizes the binder by account so review is fast and complete.","Headcount Change Alerts":"Notifies finance in Slack when Rippling headcount moves hit the budget — new hires, departures, or rate changes. Numeric quantifies the budget impact in the alert.","Bookings Digest":"Posts new Salesforce bookings to a finance Slack channel for revenue review. Numeric summarizes deal terms relevant to recognition so finance can act early.","Equity Expense Accrual":"Accrues stock-comp expense from Carta data, drafts the entry, and reconciles the equity roll-forward in NetSuite. Numeric keeps APIC and expense in agreement each period.","Equity Close Tasks":"Tracks 409A, grant, and equity close tasks against documented status. Numeric keeps the equity workstream visible alongside the rest of the close."},"HEAVY":{"Real-Time Spend Accrual":"Pulling open Ramp transactions is token-intensive. Limit runs to the current period and material accounts rather than the full card program.","Expense Policy Enforcement":"Checking every Ramp transaction against policy burns tokens fast. Run one period — or one policy category — at a time.","Cash Application Review":"Matching payments to invoices means paging through 100-row API responses. Scope to open invoices in the current period.","ARR Bridge":"Line-level billing pulls from Stripe and Salesforce are token-intensive. Build the bridge from monthly aggregates and drill into specific accounts only when a movement needs explaining.","Flux on Warehouse Financial Data":"Snowflake truncates SQL results around 250 KB. Aggregate in SQL (GROUP BY) rather than pulling row-level data into the conversation.","Board KPI Pack":"Pull pre-aggregated KPI queries, not raw tables — Snowflake truncates large results and raw pulls burn tokens fast.","Usage-Based Revenue":"Metering data is high-volume. Aggregate usage in Snowflake before it reaches the conversation — never pull raw event rows."}}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const RES = JSON.parse(document.getElementById('resources').textContent);
const byId = {}; DATA.MCPS.forEach(m => byId[m.id] = m);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

function monoUri(mark, color) {
  const svg = "<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48'><rect width='48' height='48' rx='11' fill='" + color + "'/><text x='24' y='25' font-family='Inter, sans-serif' font-size='16' font-weight='600' fill='#ffffff' text-anchor='middle' dominant-baseline='central'>" + mark + "</text></svg>";
  return 'data:image/svg+xml,' + encodeURIComponent(svg);
}
function logoSrc(m) { return RES['logo_' + m.id] || monoUri(m.mark, m.color); }
function fb(img, id) { img.onerror = null; const m = byId[id]; img.src = monoUri(m.mark, m.color); }

// group combos by workflow
const WORKFLOWS = [];
const seen = {};
DATA.COMBOS.forEach(c => {
  let w = seen[c.workflow];
  if (!w) {
    w = { title: c.workflow, category: DATA.WORKFLOW_CATEGORIES[c.workflow] || 'Uncategorized',
          payoff: c.payoff, summary: c.summary || DATA.SUMMARIES[c.workflow] || c.payoff,
          prompt: c.prompt || DATA.PROMPTS[c.workflow] || ('Run the ' + c.workflow + ' workflow for this period.'),
          heavy: DATA.HEAVY[c.workflow] || '', variants: [] };
    seen[c.workflow] = w; WORKFLOWS.push(w);
  }
  if ((!w.prompt || w.prompt.startsWith('Run the ')) && c.prompt) w.prompt = c.prompt;
  w.variants.push(c.mcps);
});
WORKFLOWS.forEach((w,i) => w.slug = i);

const sel = {};
let catFilter = 'all';

const selCount = () => DATA.MCPS.filter(m => sel[m.id]).length;
const preview = () => selCount() === 0;
function unlockedVariant(w) { return w.variants.find(v => v.every(id => sel[id])); }
function missingCount(v) { return v.filter(id => !sel[id]).length; }
function bestVariant(w) { let b = w.variants[0], bm = Infinity; w.variants.forEach(v => { const m = missingCount(v); if (m < bm) { bm = m; b = v; } }); return b; }
function displayVariant(w) { return preview() ? w.variants[0] : bestVariant(w); }

function tileHtml(m) {
  const on = !!sel[m.id];
  return `<div class="tile" onclick="toggle('${m.id}')" title="${esc(m.name)}" style="flex:0 0 calc((100% - 32px) / 5); box-sizing:border-box; display:flex; flex-direction:column; align-items:center; gap:7px; padding:14px 8px 11px; border-radius:10px; cursor:pointer; transition:border-color .15s, background .15s, box-shadow .15s; border:1px solid ${on ? 'var(--color-accent-700)' : 'var(--border-default)'}; ${on ? 'box-shadow:0 0 0 1px var(--color-accent-700);' : ''} background:${on ? 'var(--bg-accent)' : 'var(--bg-default)'};">
    <div style="width:48px; height:48px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:filter .15s, opacity .15s; filter:${on ? 'none' : 'grayscale(1)'}; opacity:${on ? 1 : 0.5};"><img src="${logoSrc(m)}" onerror="fb(this,'${m.id}')" alt="${esc(m.name)}" style="width:32px; height:32px; object-fit:contain; display:block;"></div>
    <div style="font-size:11px; font-weight:500; line-height:13px; text-align:center; white-space:nowrap; color:${on ? 'var(--text-primary)' : 'var(--text-tertiary)'}; transition:color .15s;">${esc(m.name)}</div>
  </div>`;
}

function chipHtml(id, owned) {
  const m = byId[id];
  return `<div title="${esc(m.name)}" style="width:27px; height:27px; border-radius:6px; display:flex; align-items:center; justify-content:center; flex-shrink:0; background:var(--bg-default); border:1px solid var(--border-default); filter:${owned ? 'none' : 'grayscale(1)'}; opacity:${owned ? 1 : 0.4};"><img src="${logoSrc(m)}" onerror="fb(this,'${m.id}')" alt="${esc(m.name)}" style="width:19px; height:19px; object-fit:contain; display:block;"></div>`;
}

function filterChip(label, active, onclick) {
  return `<button class="chipbtn" onclick="${onclick}" style="height:29px; padding:0 13px; border-radius:999px; cursor:pointer; font-family:inherit; font-size:12.5px; font-weight:500; white-space:nowrap; transition:all .15s; border:1px solid ${active ? 'var(--text-primary)' : 'var(--border-subtle)'}; background:${active ? 'var(--text-primary)' : 'var(--bg-default)'}; color:${active ? '#fff' : 'var(--text-secondary)'};">${label}</button>`;
}

function render() {
  document.getElementById('tiles').innerHTML = DATA.MCPS.map(tileHtml).join('');
  document.getElementById('conn-sub').textContent = selCount() + ' of ' + DATA.MCPS.length + ' selected · tap the apps you use — or comparable tools: each tile stands in for its category, and any service with an MCP covering the same functions can take its place';

  const pv = preview();
  const unlocked = pv ? WORKFLOWS.slice() : WORKFLOWS.filter(w => unlockedVariant(w));
  const nearby = pv ? [] : WORKFLOWS.filter(w => !unlockedVariant(w) && w.variants.some(v => v.some(id => sel[id])));
  nearby.sort((a,b) => missingCount(bestVariant(a)) - missingCount(bestVariant(b)));
  if (!pv) unlocked.sort((a,b) => displayVariant(a).length - displayVariant(b).length);
  const base = unlocked.concat(nearby);

  const catCounts = {};
  base.forEach(w => { catCounts[w.category] = (catCounts[w.category] || 0) + 1; });
  if (catFilter !== 'all' && !catCounts[catFilter]) catFilter = 'all';
  const inCat = ws => catFilter === 'all' ? ws : ws.filter(w => w.category === catFilter);
  const visUnlocked = inCat(unlocked), visNearby = inCat(nearby);

  const catList = DATA.CATEGORIES.filter(c => catCounts[c] > 0);
  document.getElementById('cat-chips').innerHTML =
    filterChip('All · ' + base.length, catFilter === 'all', "setCat('all')") +
    catList.map((c,i) => filterChip(esc(c) + ' · ' + catCounts[c], catFilter === c, 'setCatIdx(' + i + ')')).join('');
  window.__catList = catList;

  document.getElementById('results-sub').textContent = pv
    ? (catFilter === 'all' ? 'All ' + WORKFLOWS.length + ' prompts — select your stack above to filter by availability' : (visUnlocked.length + visNearby.length) + ' ' + catFilter + ' prompt' + ((visUnlocked.length + visNearby.length) === 1 ? '' : 's'))
    : unlocked.length + ' of ' + WORKFLOWS.length + ' prompts unlocked with your MCPs' + (nearby.length ? ' · ' + nearby.length + ' more within reach' : '') + ' — a blend of workflows used by Numeric customers and ideas created by our in-house CPAs';

  const el = document.getElementById('results');
  if (!visUnlocked.length && !visNearby.length) {
    el.innerHTML = `<div style="border:1px dashed var(--border-subtle); border-radius:10px; background:var(--bg-default); padding:44px 24px; text-align:center;">
      <div style="font-size:13.5px; font-weight:600; color:var(--text-primary); margin-bottom:4px;">No matching prompts yet</div>
      <div style="font-size:12.5px; color:var(--text-tertiary);">Toggle on a connector above to see the prompts it unlocks.</div>
    </div>`;
    return;
  }

  const grid = ws => `<div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(326px, 1fr)); gap:16px;">` + ws.map(w => {
    const v = displayVariant(w);
    return `<div class="cardx" onclick="openDetail(${w.slug})">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px;">
        <div style="display:flex; gap:4px; flex-wrap:wrap;">${v.map(id => chipHtml(id, pv ? true : !!sel[id])).join('')}</div>
      </div>
      <div style="font-size:10px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--text-tertiary); margin-bottom:6px;">${esc(w.category)}</div>
      <div style="font-size:15px; font-weight:600; color:var(--text-primary); letter-spacing:-.005em; line-height:1.3; margin-bottom:10px;">${esc(w.title)}</div>
      <div style="background:var(--bg-alt-subtle); border:1px solid var(--border-default); border-radius:6px; padding:11px 13px; font-size:12.5px; line-height:1.55; color:var(--text-primary); font-style:italic; margin-bottom:12px;">&ldquo;${esc(w.prompt)}&rdquo;</div>
      <div style="font-size:12.5px; line-height:1.5; color:var(--text-secondary); flex:1; margin-bottom:14px;">${esc(w.payoff)}</div>
      <div style="display:flex; gap:6px; padding-top:12px; border-top:1px solid var(--border-default);">
        <button class="copybtn primary" onclick="event.stopPropagation();copyPrompt(${w.slug}, this)">Copy prompt</button>
        <button class="copybtn" onclick="event.stopPropagation();openDetail(${w.slug})">Details</button>
      </div>
    </div>`;
  }).join('') + `</div>`;

  let html = grid(visUnlocked);
  if (!visUnlocked.length) html = '';
  if (visNearby.length) {
    html += `<div style="display:flex; align-items:center; gap:12px; margin:${visUnlocked.length ? '28px' : '0'} 0 14px;">
      <div style="font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--text-tertiary); white-space:nowrap;">Within reach</div>
      <div style="flex:1; height:1px; background:var(--border-default);"></div>
      <div style="font-size:11px; color:var(--text-tertiary); white-space:nowrap;">greyed logos show the connectors you&rsquo;d add</div>
    </div>` + grid(visNearby);
  }
  el.innerHTML = html;
}

function toggle(id) { sel[id] = !sel[id]; render(); }
function selectAll() { DATA.MCPS.forEach(m => sel[m.id] = true); render(); }
function clearAll() { for (const k in sel) delete sel[k]; render(); }
function setCat(c) { catFilter = c; render(); }
function setCatIdx(i) { catFilter = window.__catList[i]; render(); }

function copyPrompt(slug, btn) {
  navigator.clipboard.writeText(WORKFLOWS[slug].prompt).then(() => {
    const t = btn.textContent; btn.textContent = 'Copied ✓';
    setTimeout(() => { btn.textContent = t; }, 1300);
  });
}

function openDetail(slug) {
  const w = WORKFLOWS[slug];
  const v = displayVariant(w);
  const pv = preview();
  const logosRow = v.map((id, idx) => {
    const m = byId[id];
    const owned = pv ? true : !!sel[id];
    return `<div style="display:flex; align-items:center; gap:12px;">${idx > 0 ? '<span style="font-size:20px; color:var(--text-quaternary); font-weight:400;">+</span>' : ''}<div style="width:52px; height:52px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; background:var(--bg-default); border:1px solid var(--border-default); box-shadow:var(--shadow-sm); filter:${owned ? 'none' : 'grayscale(1)'}; opacity:${owned ? 1 : 0.45};"><img src="${logoSrc(m)}" onerror="fb(this,'${m.id}')" alt="${esc(m.name)}" style="width:30px; height:30px; object-fit:contain; display:block;"></div></div>`;
  }).join('');
  const conns = v.map(id => {
    const m = byId[id];
    const owned = pv ? true : !!sel[id];
    return `<div style="display:flex; align-items:flex-start; gap:10px;">
      <div style="width:30px; height:30px; border-radius:7px; display:flex; align-items:center; justify-content:center; flex-shrink:0; background:var(--bg-default); border:1px solid var(--border-default); filter:${owned ? 'none' : 'grayscale(1)'}; opacity:${owned ? 1 : 0.45};"><img src="${logoSrc(m)}" onerror="fb(this,'${m.id}')" alt="${esc(m.name)}" style="width:20px; height:20px; object-fit:contain; display:block;"></div>
      <div style="flex:1; min-width:0;">
        <div style="font-size:12px; font-weight:600; color:var(--text-primary); margin-bottom:2px;">${esc(m.name)}</div>
        <div style="font-size:12px; line-height:16px; color:var(--text-secondary);">${esc(DATA.ROLES[id] || '')}</div>
      </div>
    </div>`;
  }).join('');
  const heavy = w.heavy ? `<div style="margin:0 0 20px; padding:11px 14px; background:var(--color-warning-25); border:1px solid var(--color-warning-200); border-radius:8px;">
    <div style="font-size:10px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--text-warning-primary); margin-bottom:6px;">⚡ High Token Usage</div>
    <div style="font-size:12px; line-height:17px; color:var(--text-warning-primary);">${esc(w.heavy)}</div>
  </div>` : '';

  document.getElementById('modal').innerHTML = `
  <div onclick="closeDetail()" style="position:fixed; inset:0; background:rgba(20,19,15,.4); display:flex; align-items:center; justify-content:center; padding:24px; z-index:50; font-family:var(--font-family-body);">
    <div onclick="event.stopPropagation()" style="width:100%; max-width:480px; max-height:88vh; overflow-y:auto; background:var(--bg-default); border:1px solid var(--border-default); border-radius:var(--radius-2xl); box-shadow:var(--shadow-2xl);">
      <div style="position:relative; padding:30px 24px 24px; background:var(--bg-alt-subtle); border-bottom:1px solid var(--border-default);">
        <button class="btnx" onclick="closeDetail()" aria-label="Close" style="position:absolute; top:14px; right:14px; width:26px; height:26px; border:1px solid var(--border-default); background:var(--bg-default); border-radius:6px; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--text-tertiary); font-size:15px; line-height:1; padding:0;">×</button>
        <div style="display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap;">${logosRow}</div>
      </div>
      <div style="padding:20px 24px 24px;">
        <h3 style="font-size:16px; font-weight:600; letter-spacing:-.01em; color:var(--text-primary); margin:0 0 8px;">${esc(w.title)}</h3>
        <p style="font-size:13px; line-height:18px; color:var(--text-secondary); margin:0 0 18px;">${esc(w.payoff)}</p>
        <div style="margin:0 0 20px; padding:12px 14px; background:var(--bg-alt-subtle); border:1px solid var(--border-default); border-radius:8px;">
          <div style="display:flex; align-items:center; gap:6px; margin-bottom:7px;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="var(--color-accent-700)"><path d="M12 2 C 12.8 6.6, 13.8 8.2, 17 9 C 20.2 9.8, 21.8 10.2, 22 12 C 21.8 13.8, 20.2 14.2, 17 15 C 13.8 15.8, 12.8 17.4, 12 22 C 11.2 17.4, 10.2 15.8, 7 15 C 3.8 14.2, 2.2 13.8, 2 12 C 2.2 10.2, 3.8 9.8, 7 9 C 10.2 8.2, 11.2 6.6, 12 2 Z"></path></svg>
            <span style="font-size:10px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--text-tertiary);">Sample Prompt</span>
            <button class="btnx" onclick="copyPrompt(${w.slug}, this)" style="margin-left:auto; height:22px; padding:0 10px; border:1px solid var(--border-default); background:var(--bg-default); border-radius:5px; font-family:inherit; font-size:10px; font-weight:600; color:var(--text-secondary); cursor:pointer;">Copy</button>
          </div>
          <div style="font-size:12px; line-height:17px; color:var(--text-primary); font-style:italic;">&ldquo;${esc(w.prompt)}&rdquo;</div>
        </div>
        ${heavy}
        <div style="font-size:10px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--text-tertiary); margin-bottom:11px;">How It Connects</div>
        <div style="display:flex; flex-direction:column; gap:12px;">${conns}</div>
        <div style="margin-top:14px; font-size:11px; line-height:15px; color:var(--text-tertiary);">Or a comparable tool — any connector above can be swapped for another service&rsquo;s MCP that covers the same functions.</div>
        <div style="margin-top:20px; padding-top:18px; border-top:1px solid var(--border-default);">
          <div style="font-size:10px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--text-tertiary); margin-bottom:9px;">What It Does</div>
          <p style="font-size:12px; line-height:18px; color:var(--text-secondary); margin:0;">${esc(w.summary)}</p>
        </div>
      </div>
    </div>
  </div>`;
  document.getElementById('modal').style.display = 'block';
}
function closeDetail() { document.getElementById('modal').style.display = 'none'; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

render();
</script>
</body>
</html>
